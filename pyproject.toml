[project]
name = "aiframecut"
version = "0.7.0"
description = "AI Frame Cut â€” give Claude & ChatGPT eyes, ears, and fast hands for video. Local, no API keys: contact sheets, on-device transcription, edit-word detection, cinematic grading, branded animated titles (channel avatar + Subscribe/Like), background music with ducking, cutting, audio/voice effects, and quick previews."
readme = "README.md"
requires-python = ">=3.9,<3.13"
license = { text = "MIT" }
dependencies = [
    "pillow>=9",
    "faster-whisper>=1.0",
]

[project.scripts]
aiframecut = "aiframecut.cli:main"
afc = "aiframecut.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aiframecut"]
