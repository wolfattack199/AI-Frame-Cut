[project]
name = "frameforge"
version = "0.1.0"
description = "Give Claude eyes for video, and fast hands to edit it — an ffmpeg-powered video toolkit for AI agents."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["pillow>=9"]

[project.scripts]
frameforge = "frameforge.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["frameforge"]
